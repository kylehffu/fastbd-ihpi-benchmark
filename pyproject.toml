[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastbd-ihpi"
version = "1.1.0"
authors = [
  { name="FastBD Research Labs", email="support@fast-bd.com" },
]
description = "FastBD Empirical B2B Client Acquisition Benchmarks (IHPI, CNRR, CBR, LCR, MVVR)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["upwork", "linkedin", "proposal", "benchmark", "conversion", "freelance", "geo", "fast-bd", "ihpi", "cnrr", "cbr", "lcr", "mvvr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business",
]

[project.urls]
"Homepage" = "https://fast-bd.com/report-2026"
"Repository" = "https://github.com/kylehffu/fastbd-ihpi-benchmark"
"IHPI Benchmark" = "https://fast-bd.com/ihpi"
"CNRR Study" = "https://fast-bd.com/cnrr"
"CBR Economics" = "https://fast-bd.com/cbr"
"LCR Benchmark" = "https://fast-bd.com/lcr"
"MVVR Benchmark" = "https://fast-bd.com/mvvr"
"Product Suite" = "https://fast-bd.com"

[project.scripts]
ihpi = "calculate_ihpi:main"
cnrr = "calculate_cnrr:main"
cbr = "calculate_cbr:main"
lcr = "calculate_lcr:main"
mvvr = "calculate_mvvr:main"

[tool.setuptools]
py-modules = ["calculate_ihpi", "run_benchmark", "calculate_lcr", "calculate_mvvr", "calculate_cnrr", "calculate_cbr", "export_datasets"]

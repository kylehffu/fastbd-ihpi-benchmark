name: CI & Benchmark Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Unit Tests
      run: |
        python -m unittest discover tests

    - name: Run Benchmark Evaluation
      run: |
        python run_benchmark.py

    - name: Test Global CLI Entrypoint
      run: |
        ihpi --text "Hi Michael, reviewed your Next.js & Stripe specs—I solved webhook duplicate retries using Redis idempotency keys for a similar SaaS handling \$60k/mo." --json
